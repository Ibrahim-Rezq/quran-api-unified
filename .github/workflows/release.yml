name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# OIDC trusted publishing to npm: no NPM_TOKEN. `id-token: write` lets the job mint the
# short-lived OIDC token npm exchanges for publish auth; provenance is attached
# automatically. Requires the trusted publisher to be configured on npmjs.com first
# (one-time, after the package's initial manual publish).
permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: version-or-publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # Opens/updates the "Version Packages" PR when changesets exist; when that PR is
      # merged (versions bumped, changesets consumed), runs `changeset publish` → npm.
      # pnpm 10 (pinned via packageManager) publishes with OIDC; pnpm 11 regressed this.
      - name: Create Release PR or publish
        uses: changesets/action@v1
        with:
          version: pnpm version:packages
          publish: pnpm release
          commit: 'chore(release): version packages'
          title: 'chore(release): version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
