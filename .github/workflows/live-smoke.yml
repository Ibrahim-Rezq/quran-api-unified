name: Live Smoke

# Opt-in, non-blocking drift detection: hits real providers to catch when an upstream
# API has drifted away from the recorded fixtures. Weekly + manual. Provider credentials
# come from repo secrets once credentialed adapters exist.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:live
